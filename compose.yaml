name: ai-voice-notes

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_voice_notes
      POSTGRES_USER: ai_voice_notes
      POSTGRES_PASSWORD: ai_voice_notes
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_voice_notes -d ai_voice_notes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-test:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    profiles: ["test"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_voice_notes_test
      POSTGRES_USER: ai_voice_notes
      POSTGRES_PASSWORD: ai_voice_notes
    ports:
      - "127.0.0.1:${TEST_DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_voice_notes -d ai_voice_notes_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  db-test-data:
